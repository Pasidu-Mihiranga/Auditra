<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditra Web App - Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 50px 40px;
            text-align: center;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            color: #667eea;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .card-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .card.employee {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .card.employee:hover {
            box-shadow: 0 15px 30px rgba(245, 87, 108, 0.4);
        }

        .card-icon {
            font-size: 48px;
        }

        .card-title {
            font-size: 24px;
            font-weight: 600;
        }

        .card-description {
            font-size: 14px;
            opacity: 0.9;
        }

        @media (min-width: 768px) {
            .card-container {
                flex-direction: row;
            }

            .card {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏢</div>
        <h1>Auditra</h1>
        <p class="subtitle">Choose your registration type</p>
        
        <div class="card-container">
            <a href="client-form.html" class="card">
                <div class="card-icon">👤</div>
                <div class="card-title">Client Registration</div>
                <div class="card-description">Register as a client</div>
            </a>
            
            <a href="employee-form.html" class="card employee">
                <div class="card-icon">👨‍💼</div>
                <div class="card-title">Employee Registration</div>
                <div class="card-description">Register as an employee</div>
            </a>
        </div>
    </div>
</body>
</html>
